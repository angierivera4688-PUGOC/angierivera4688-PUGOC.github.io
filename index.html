<title>HomeCount · Presupuesto del Hogar</title>
<style>
:root{--fab1:#E6468F;--fab2:#8B4FD6;--glow:216,70,170;--sh:185,162,224;--track:#EFE7F7;--field:#FCFAFE;--bg1:#F1E8FA;--bg2:#FBE9F1;--bg3:#E6F1FA;--pink:#F4A6BE;--pinkL:#FBDCE6;--lil:#B9A2E0;--lilL:#E9DFF7;--sky:#A9CDEF;--skyL:#DCEBF8;--mint:#AEE0C9;--mintL:#D9F1E6;--gold:#F6D98C;--ink:#4A3558;--pur:#7B4B94;--grey:#8A7A94;--card:rgba(255,255,255,.88)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);background-attachment:fixed}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(110px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:0;color:var(--pur)}
h2{font-size:15px;margin:22px 4px 10px;color:var(--pur)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.icon-btn{border:0;background:var(--card);width:40px;height:40px;border-radius:14px;font-size:18px;box-shadow:0 3px 10px rgba(var(--sh),.2);color:var(--ink)}
.month{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 14px}
.month b{min-width:150px;text-align:center;font-size:16px;color:var(--pur)}
.month button{border:0;background:var(--card);width:34px;height:34px;border-radius:12px;font-size:16px;color:var(--pur);box-shadow:0 3px 8px rgba(var(--sh),.2)}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 6px 18px rgba(var(--sh),.18);margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{border-radius:18px;padding:12px 14px;color:var(--ink)}
.mini small{display:block;font-size:11px;opacity:.75;margin-bottom:3px}
.mini b{font-size:17px}
.ringwrap{position:relative;width:230px;height:230px;margin:2px auto 6px}
.ringwrap svg{width:100%;height:100%}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

.chip.m.on{background:var(--pink)}.chip.n.on{background:var(--mint);color:#27644B}
.seg{display:flex;background:var(--lilL);border-radius:16px;padding:4px;margin:0 0 12px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:12px;font-size:13px;font-weight:700;color:var(--pur)}

.days{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:10px}

.btn{border:0;border-radius:16px;padding:13px 18px;font-weight:700;font-size:14px;background:var(--lil);color:#fff;width:100%}
.btn.sec{background:var(--lilL);color:var(--pur)}.btn.del{background:var(--pinkL);color:#A03A5A}

.chk{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--lil);background:#fff;font-size:15px;color:#fff;flex:none}
.chk.on{background:var(--mint);border-color:var(--mint)}
nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-radius:26px 26px 0 0;display:flex;justify-content:space-around;align-items:flex-end;padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 22px rgba(var(--sh),.2);z-index:5}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--grey);padding:4px 10px;font-weight:600;border-radius:18px;transition:background .25s,box-shadow .25s,color .25s}
nav button span{font-size:22px;filter:none;transition:transform .25s,filter .25s}
nav button.on{color:var(--pur);font-weight:800}nav button.on span{transform:scale(1.2);filter:drop-shadow(0 0 5px rgba(var(--glow),1)) drop-shadow(0 0 10px rgba(var(--glow),.85)) drop-shadow(0 0 16px rgba(var(--glow),.55))}
nav .fab{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--fab1),var(--fab2));color:#fff;font-size:32px;font-weight:700;margin-top:-28px;box-shadow:0 8px 20px rgba(var(--glow),.6),0 0 0 4px rgba(255,255,255,.9);justify-content:center;padding:0;line-height:1}nav .fab:active{transform:scale(.94)}
.mask{position:fixed;inset:0;background:rgba(40,30,50,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 12px;color:var(--pur);font-size:17px}
label{display:block;font-size:12px;color:var(--grey);margin:12px 2px 5px;font-weight:600}
input,select{width:100%;border:2px solid var(--track);background:var(--field);border-radius:14px;padding:12px 13px;font-size:16px;color:var(--ink);font-family:inherit}
input:focus,select:focus{outline:0;border-color:var(--lil)}
.amtbox{display:flex;align-items:center;justify-content:center;gap:10px;border:2px solid var(--track);background:var(--field);border-radius:14px;padding:12px 13px;color:var(--pur);font-size:34px;font-weight:800}
.amtbox:focus-within{border-color:var(--lil)}.amtbox span{white-space:nowrap}
.amtbox input{border:0!important;background:none!important;padding:0!important;width:1ch;min-width:1ch;max-width:70%;font-size:34px;font-weight:800;color:var(--pur);text-align:left;border-radius:0}.amtbox input::placeholder{color:var(--pur);opacity:.45}
.big{font-size:34px!important;font-weight:800;text-align:center;color:var(--pur)}
.mic{width:100%;margin-top:10px;border:2px dashed var(--lil);background:var(--lilL);color:var(--pur);border-radius:16px;padding:11px;font-weight:700;font-size:14px}
.mic.rec{background:var(--pinkL);border-color:var(--pink);color:#A03A5A}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calmask{position:fixed;inset:0;background:rgba(20,16,26,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:14px}
.cal{background:#5d5d62;color:#fff;border-radius:22px;width:100%;max-width:640px;max-height:96vh;overflow:auto;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.45);font-family:inherit;animation:up .2s ease}
.cal .ch{background:#4b4b50;padding:16px 20px}.cal .ch small{display:block;font-size:14px;color:#c9c9ce;font-weight:600}.cal .ch b{display:block;font-size:26px;line-height:1.15;margin-top:4px;font-weight:800}
.cal .cb{padding:12px 14px 10px;flex:1}
.cal .cn{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.cal .cn b{font-size:16px;font-weight:700}
.cal .cn button{border:0;background:none;color:#fff;font-size:22px;width:40px;height:40px;border-radius:50%;font-family:inherit}.cal .cn button:active{background:rgba(255,255,255,.15)}
.cal .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .cg i{font-style:normal;font-size:12px;color:#c9c9ce;font-weight:700;padding:6px 0}
.cal .cg button{border:0;background:none;color:#fff;font-family:inherit;font-size:15px;font-weight:600;aspect-ratio:1;max-height:46px;margin:auto;width:100%;max-width:46px;border-radius:50%}
.cal .cg button.t{box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.cal .cg button.s{background:linear-gradient(135deg,var(--fab1),var(--fab2));box-shadow:0 3px 10px rgba(var(--glow),.5);font-weight:800}
.cal .cf{display:flex;justify-content:space-between;gap:6px;padding:4px 12px 14px}.cal .cf button{border:0;background:none;color:#d8d8dd;font-family:inherit;font-weight:800;font-size:15px;padding:10px 12px;border-radius:12px}.cal .cf button.ok{color:#fff;background:rgba(255,255,255,.16)}
@media(max-height:560px){.cal .cg button{max-width:32px;font-size:13px}.cal .cg i{padding:3px 0}.cal .ch{padding:12px 16px!important}.cal .cb{padding:6px 12px 2px}.cal .cn button{height:32px}.cal .cf{padding-bottom:8px!important}}
@media(min-width:560px){.cal{flex-direction:row;flex-wrap:wrap}.cal .ch{width:36%;padding:24px 20px}.cal .ch b{font-size:30px}.cal .cb{width:64%}.cal .cf{width:100%;justify-content:flex-end;padding-left:36%}}
.dtf{position:relative;display:flex;gap:8px}.dtf>input:first-child{flex:1;min-width:0}.dtb{border:0;background:var(--lilL);border-radius:14px;width:54px;font-size:22px;flex:none}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}.tcard{border:3px solid transparent;background:#fff;border-radius:22px;padding:12px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.08);font-family:inherit}.tcard.on{border-color:var(--lil)}.tcard b{display:block;font-size:15px;margin-top:8px;color:#333}.tcard small{color:#777;font-size:11.5px}.sw{display:flex;height:54px;border-radius:14px;overflow:hidden}.sw i{flex:1}.full{position:fixed;inset:0;z-index:40;overflow:auto;padding:calc(env(safe-area-inset-top) + 36px) 18px 30px;background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3))}.full .in{max-width:480px;margin:0 auto}#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;z-index:30;opacity:0;transition:.25s;pointer-events:none;max-width:86%;text-align:center}
#toast.on{opacity:1}
.tot{display:flex;justify-content:space-between;font-size:13px;color:var(--grey);margin:2px 4px 10px}
.tot b{color:var(--pur)}
.rc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rc button{border:2px solid var(--lilL);background:#fff;border-radius:14px;padding:8px 2px;font-size:12px;color:var(--ink);font-weight:700}
.rc button small{display:block;font-weight:500;color:var(--grey);font-size:10px}
.rc button.on{background:var(--mint);border-color:var(--mint);color:#27644B}
</style>

<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
'use strict';
const KEY='lila_finanzas_v1';
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DEF_CATS=[['Comida','🍽️'],['Transporte','🚌'],['Ocio','🎬'],['Ropa y cuidado','💄'],['Salud','💊'],['Hogar','🏠'],['Estudios','📚'],['Regalos','🎁'],['Otros','✨']];
const uid=()=>Math.random().toString(36).slice(2,9);
const todayStr=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,k)=>a.reduce((t,x)=>t+(+x[k]||0),0);
let S=load();
const THEMES={
 fucsia:{n:'Fucsia',s:'Tono para mujer',v:{'--pink':'#F4A6BE','--pinkL':'#FBDCE6','--lil':'#B9A2E0','--lilL':'#E9DFF7','--sky':'#A9CDEF','--skyL':'#DCEBF8','--mint':'#AEE0C9','--mintL':'#D9F1E6','--ink':'#4A3558','--pur':'#7B4B94','--grey':'#8A7A94','--track':'#EFE7F7','--field':'#FCFAFE','--sh':'185,162,224','--bg1':'#F1E8FA','--bg2':'#FBE9F1','--bg3':'#E6F1FA','--fab1':'#E6468F','--fab2':'#8B4FD6','--glow':'216,70,170'},tc:'#EFE5F8',ic:['#F4A6BE','#B9A2E0']},
 azul:{n:'Azul',s:'Tono para hombre',v:{'--pink':'#F0A3A3','--pinkL':'#F9DADA','--lil':'#7FA6E0','--lilL':'#DCE8F8','--sky':'#8FD0E6','--skyL':'#D8EFF7','--mint':'#A8DCC8','--mintL':'#D6F0E6','--ink':'#1F3350','--pur':'#24508F','--grey':'#6F8099','--track':'#E4ECF7','--field':'#F7FAFE','--sh':'95,143,208','--bg1':'#EAF1FB','--bg2':'#E6F4FA','--bg3':'#F1F5FB','--fab1':'#2F86F0','--fab2':'#1B4DB0','--glow':'47,134,240'},tc:'#EAF1FB',ic:['#8FD0E6','#5F8FD0']},
 verde:{n:'Verde',s:'Unisex',v:{'--pink':'#F4A9A0','--pinkL':'#FBDDD8','--lil':'#7DC9A0','--lilL':'#DAF1E4','--sky':'#A6D8D0','--skyL':'#DDF1EE','--mint':'#B7DD8E','--mintL':'#E6F3D3','--ink':'#1F4235','--pur':'#2E7D5B','--grey':'#6E8A7C','--track':'#E3F1E9','--field':'#F7FCF9','--sh':'95,176,136','--bg1':'#E9F6EE','--bg2':'#F4FAEA','--bg3':'#E6F3F0','--fab1':'#2BB673','--fab2':'#16774F','--glow':'43,182,115'},tc:'#E9F6EE',ic:['#B7DD8E','#5FB088']},
 naranja:{n:'Naranja',s:'Unisex',v:{'--pink':'#EE8FA3','--pinkL':'#FADCE3','--lil':'#F5A25D','--lilL':'#FDE6D0','--sky':'#F7C77E','--skyL':'#FDEFD0','--mint':'#A7D9A0','--mintL':'#DDF1D8','--ink':'#4A2E1B','--pur':'#B5561E','--grey':'#8F7766','--track':'#F7EADD','--field':'#FFFAF5','--sh':'224,160,96','--bg1':'#FDF0E3','--bg2':'#FBE8DD','--bg3':'#FFF6E0','--fab1':'#F58A25','--fab2':'#D14F17','--glow':'245,138,37'},tc:'#FDF0E3',ic:['#F7C77E','#F08A3C']}
};
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#999';
function makeIcon(a,b){
  const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,a);g.addColorStop(1,b);x.fillStyle=g;x.fillRect(0,0,180,180);
  x.lineWidth=22;x.strokeStyle='rgba(255,255,255,.92)';x.beginPath();x.arc(90,90,52,0,7);x.stroke();
  const arcs=[[-1.57,.3,cv('--sky')],[.5,1.8,cv('--mint')],[2.0,3.0,'#F6D98C']];
  arcs.forEach(([s,e,col])=>{x.strokeStyle=col;x.beginPath();x.arc(90,90,52,s,e);x.stroke()});
  x.fillStyle='#fff';x.beginPath();x.arc(90,90,22,0,7);x.fill();x.fillStyle=b;x.beginPath();x.arc(90,90,16,0,7);x.fill();
  x.fillStyle='#fff';x.fillRect(86,78,8,24);x.fillRect(78,80,24,5);x.fillRect(78,93,24,5);
  return c.toDataURL('image/png')
}
function applyTheme(k){
  const t=THEMES[k]||THEMES.fucsia,r=document.documentElement;
  Object.entries(t.v).forEach(([a,b])=>r.style.setProperty(a,b));
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t.tc;
  
}
function themeCards(cur){return Object.entries(THEMES).map(([k,t])=>`<button class="tcard ${k===cur?'on':''}" onclick="pickTheme('${k}')"><div class="sw"><i style="background:${t.v['--lil']}"></i><i style="background:${t.v['--sky']}"></i><i style="background:${t.v['--mint']}"></i><i style="background:${t.v['--pink']}"></i></div><b>${t.n}</b><small>${t.s}</small></button>`).join('')}
function pickTheme(k){S.cfg.theme=k;save();applyTheme(k);const f=document.getElementById('full');if(f)f.remove();closeSheet();render();toast('Estilo '+THEMES[k].n+' ✨')}
function askTheme(){
  const d=document.createElement('div');d.className='full';d.id='full';
  d.innerHTML=`<div class="in"><h1 style="font-size:26px;text-align:center">¿Qué estilo prefieres?</h1><p style="text-align:center;color:var(--grey);margin:8px 0 18px">Elige los colores de tu app. Podrás cambiarlos cuando quieras en ⚙️ Ajustes.</p><div class="themes">${themeCards('')}</div></div>`;
  document.body.appendChild(d)
}

/* periodo: empieza el día pday de cada mes (1 = mes calendario). Se identifica por el mes en que empieza */
const pad2=n=>String(n).padStart(2,'0');
const PD=()=>Math.min(28,Math.max(1,parseInt(S.cfg.pday)||1));
const PM=()=>PD()===1?'mes':'periodo';
function pRange(ym){const [y,m]=ym.split('-').map(Number),d=PD(),a=y+'-'+pad2(m)+'-'+pad2(d);
  if(d===1)return[a,y+'-'+pad2(m)+'-'+pad2(new Date(y,m,0).getDate())];
  let ny=y,nm=m+1;if(nm>12){nm=1;ny++}return[a,ny+'-'+pad2(nm)+'-'+pad2(d-1)]}
const inP=(date,ym)=>{const r=pRange(ym);return date>=r[0]&&date<=r[1]};
function ymOf(date){let y=+date.slice(0,4),m=+date.slice(5,7);if(+date.slice(8,10)<PD()){m--;if(m<1){m=12;y--}}return y+'-'+pad2(m)}
let ui={tab:'home',ym:ymOf(todayStr()),filter:'all',fk:'fijo'};
function fresh(){return{cfg:{cur:'S/',meta:20,tope:5},ing:[],gas:[],cats:DEF_CATS.map(([n,i])=>({n,i,b:0})),fijos:[],metas:[{id:uid(),n:'Fondo de emergencia',obj:0,date:''}],aportes:[],reto:{}}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.cfg)return s}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No pude guardar en este navegador')}}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
const money=(n,c)=>(c||S.cfg.cur)+' '+(+n||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const CURS=['S/','US$','€','£','$','CLP$','COL$','MX$','ARS$'];
const metaCur=id=>{const m=S.metas.find(x=>x.id===id);return(m&&m.cur)||S.cfg.cur};
function curField(id,cur){const c=cur||S.cfg.cur,known=CURS.includes(c);
  return`<select id="${id}" onchange="curChg('${id}')">${CURS.map(k=>`<option ${k===c?'selected':''}>${esc(k)}</option>`).join('')}<option value="__o" ${known?'':'selected'}>Otra…</option></select><input id="${id}_o" placeholder="Símbolo, ej. R$" maxlength="6" style="margin-top:6px;${known?'display:none':''}" value="${known?'':esc(c)}" oninput="invLiveSafe()">`}
function curChg(id){const o=document.getElementById(id+'_o');o.style.display=document.getElementById(id).value==='__o'?'':'none';invLiveSafe()}
function curVal(id){const v=document.getElementById(id).value;return v==='__o'?(val(id+'_o').trim()||S.cfg.cur):v}
function invLiveSafe(){if(document.getElementById('invres'))invLive()}
const catIcon=n=>(S.cats.find(c=>c.n===n)||{i:'✨'}).i;
const ymLabel=ym=>{if(PD()===1)return MESES[+ym.slice(5,7)-1]+' '+ym.slice(0,4);
  const [a,b]=pRange(ym),f=x=>(+x.slice(8,10))+' '+MESES[+x.slice(5,7)-1].slice(0,3).toLowerCase();
  return f(a)+(a.slice(0,4)!==b.slice(0,4)?' '+a.slice(0,4):'')+' – '+f(b)+' '+b.slice(0,4)};
function shift(d){let [y,m]=ui.ym.split('-').map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}ui.ym=y+'-'+String(m).padStart(2,'0');render()}
const dayLabel=d=>{const x=new Date(d+'T12:00');return ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][x.getDay()]+' '+x.getDate()+' '+MESES[x.getMonth()].slice(0,3)};
const timesPaid=f=>Object.keys(f.paid||{}).filter(k=>f.paid[k]).length;

function calc(ym){
  const ing=sum(S.ing.filter(x=>inP(x.date,ym)),'amt');
  const g=S.gas.filter(x=>inP(x.date,ym));
  const vars=sum(g.filter(x=>x.tipo!=='M'),'amt'),muertos=sum(g.filter(x=>x.tipo==='M'),'amt');
  const fijos=sum(S.fijos.filter(f=>f.paid&&f.paid[ym]),'amt');
  const comprometido=sum(S.fijos,'amt');
  const ahorro=sum(S.aportes.filter(a=>inP(a.date,ym)&&metaCur(a.meta)===S.cfg.cur),'amt');
  const gastado=fijos+vars+muertos,disp=ing-gastado-ahorro;
  let est='none';
  if(ing>0){est=disp<0?'bad':((ahorro/ing*100<S.cfg.meta||muertos/ing*100>S.cfg.tope)?'warn':'ok')}
  return{ing,vars,muertos,fijos,comprometido,ahorro,gastado,disp,est,g}
}
const EST={ok:'Controlado',warn:'Cuidado',bad:'Me pasé',none:'Sin ingresos aún'};

/* ---------- vistas ---------- */
function ring(c){
  const R=78,C=2*Math.PI*R,base=Math.max(c.ing,c.gastado+c.ahorro,1);
  let off=0,s=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${cv('--track')}" stroke-width="20"/>`;
  [[c.fijos,cv('--lil')],[c.vars,cv('--sky')],[c.muertos,cv('--pink')],[c.ahorro,cv('--mint')]].forEach(([v,col])=>{
    if(v<=0)return;const len=v/base*C;
    s+=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${col}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;off+=len});
  return`<div class="ringwrap"><svg viewBox="0 0 200 200">${s}</svg><div class="ringc"><small>Disponible</small><b>${money(c.disp)}</b><small>de ${money(c.ing)}</small></div></div>`
}

/* ---------- inversiones: calculadora de retorno ---------- */
const INV=()=>S.inv||(S.inv=[]);
const INV_T={tea:'TEA (efectiva anual)',nom:'Nominal, capitaliza cada mes',sim:'Interés simple (sin reinvertir)'};
function invCalc(P,mens,rate,years,tipo){
  const r=rate/100,n=Math.round(years*12),rows=[];let b=P;
  const im=tipo==='tea'?Math.pow(1+r,1/12)-1:r/12;
  const at=t=>{ // saldo al mes t
    if(tipo==='sim')return P+P*r*t/12+mens*t+mens*(r/12)*t*(t-1)/2;
    let x=P;for(let k=1;k<=t;k++)x=x*(1+im)+mens;return x};
  for(let y=1;y<=Math.floor(years);y++)rows.push({y,bal:at(y*12),inv:P+mens*y*12});
  if(years>Math.floor(years)+1e-9)rows.push({y:years,bal:at(n),inv:P+mens*n});
  const final=at(n),invested=P+mens*n;
  return{final,invested,gain:final-invested,pct:invested>0?(final-invested)/invested*100:0,rows}}
function invRead(){const f=id=>parseFloat(String(val(id)).replace(',','.'));
  return{cur:curVal('v_cur'),n:val('v_n').trim(),amt:f('v_a')||0,mens:f('v_m')||0,rate:f('v_r'),years:f('v_y'),tipo:val('v_t')}}
function invHTML(c,cu){return`<div style="background:var(--mintL);border-radius:18px;padding:14px;margin-top:14px;text-align:center"><small style="color:var(--grey)">Al terminar tendrás</small><div style="font-size:28px;font-weight:800;color:var(--pur)">${money(c.final,cu)}</div>
  <div style="display:flex;justify-content:space-around;margin-top:8px;font-size:12.5px;color:var(--grey)"><span>Pones<br><b style="color:var(--ink)">${money(c.invested,cu)}</b></span><span>Ganas<br><b style="color:#2F8F5B">+${money(c.gain,cu)}</b></span><span>Rendimiento<br><b style="color:var(--ink)">${c.pct.toFixed(1)}%</b></span></div></div>
  <div style="max-height:150px;overflow:auto;margin-top:10px"><table style="width:100%;font-size:12.5px;border-collapse:collapse"><tr style="color:var(--grey);text-align:right"><th style="text-align:left;font-weight:600">Año</th><th style="font-weight:600">Pones</th><th style="font-weight:600">Tendrás</th></tr>${c.rows.map(r=>`<tr style="text-align:right;border-top:1px solid var(--track)"><td style="text-align:left;padding:5px 0">${Number.isInteger(r.y)?r.y:r.y.toFixed(1)}</td><td>${money(r.inv,cu)}</td><td><b>${money(r.bal,cu)}</b></td></tr>`).join('')}</table></div>`}
function invLive(){const v=invRead(),el=document.getElementById('invres');if(!el)return;
  if(!(v.rate>=0)||!(v.years>0)||v.years>60||(!(v.amt>0)&&!(v.mens>0))){el.innerHTML='<p class="empty" style="padding:14px 0 0">Escribe el monto, la tasa y los años para ver cuánto tendrás.</p>';return}
  el.innerHTML=invHTML(invCalc(v.amt,v.mens,v.rate,v.years,v.tipo),v.cur)}
function openInv(id){const o=id?INV().find(x=>x.id===id):null;
  sheet(`<h3>📈 Calculadora de inversión</h3>
  <label>Nombre (para guardarla)</label><input id="v_n" placeholder="Ej. Depósito a plazo, fondo mutuo" value="${o?esc(o.n):''}">
  <div class="two"><div><label>Monto inicial</label><input id="v_a" inputmode="decimal" value="${o?o.amt:''}" oninput="invLive()"></div><div><label>Aporte cada mes (opcional)</label><input id="v_m" inputmode="decimal" value="${o&&o.mens?o.mens:''}" oninput="invLive()"></div></div>
  <div class="two"><div><label>Tasa anual (%)</label><input id="v_r" inputmode="decimal" placeholder="Ej. 6.5" value="${o?o.rate:''}" oninput="invLive()"></div><div><label>Plazo (años)</label><input id="v_y" inputmode="decimal" placeholder="Ej. 5" value="${o?o.years:''}" oninput="invLive()"></div></div>
  <label>Moneda</label>${curField('v_cur',o&&o.cur)}
  <label>Tipo de tasa</label><select id="v_t" onchange="invLive()">${Object.entries(INV_T).map(([k,t])=>`<option value="${k}" ${(o?o.tipo:'tea')===k?'selected':''}>${t}</option>`).join('')}</select>
  <div id="invres"></div>
  <div class="two" style="margin-top:14px"><button class="btn sec" onclick="closeSheet()">Cerrar</button><button class="btn" onclick="saveInv('${id||''}')">${o?'Guardar cambios':'Guardar inversión'}</button></div>
  ${o?`<button class="btn del" style="margin-top:10px" onclick="delInv('${id}')">Eliminar inversión</button>`:''}
  <p style="font-size:11.5px;color:var(--grey);margin:12px 2px 0">Es una proyección con tasa fija; no garantiza resultados reales ni incluye impuestos o comisiones.</p>`);
  invLive()}

/* ---------- hojas modales ---------- */
function sheet(html){closeSheet();const m=document.createElement('div');m.className='mask';m.id='mask';m.innerHTML=`<div class="sheet">${html}</div>`;m.addEventListener('click',e=>{if(e.target===m)closeSheet()});document.body.appendChild(m)}
function closeSheet(){const m=document.getElementById('mask');if(m)m.remove()}
const val=id=>document.getElementById(id).value;
/* fecha: se escribe con el teclado (dd/mm/aaaa) o con el calendario 📅 */
function dateField(id,iso){
  const d=iso?iso.split('-').reverse().join('/'):'';
  return `<div class="dtf"><input id="${id}" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" autocomplete="off" value="${d}" oninput="fmtDate(this)"><button type="button" class="dtb" onclick="pickDate('${id}')" aria-label="Abrir calendario">📅</button><input id="${id}_p" type="date" tabindex="-1" aria-hidden="true" style="position:absolute;right:0;bottom:0;opacity:0;width:1px;height:1px;pointer-events:none" value="${iso||''}" onchange="pickedDate('${id}',this.value)"></div>`}
function fmtDate(e){let v=e.value.replace(/\D/g,'').slice(0,8);if(v.length>4)v=v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);else if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);e.value=v}
function getDate(id){const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(val(id).trim());if(!m)return '';const d=+m[1],mo=+m[2],y=+m[3],x=new Date(y,mo-1,d);if(x.getFullYear()!==y||x.getMonth()!==mo-1||x.getDate()!==d)return '';return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
const DOW=['L','M','M','J','V','S','D'],DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'],MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
let CAL={};
function pickDate(id){const c=getDate(id)||todayStr(),a=c.split('-').map(Number);CAL={id,y:a[0],m:a[1]-1,sel:c};calDraw()}
function calDraw(){let m=document.getElementById('calmask');if(!m){m=document.createElement('div');m.className='calmask';m.id='calmask';m.addEventListener('click',e=>{if(e.target===m)calClose()});document.body.appendChild(m)}
  const{y,m:mo,sel}=CAL,s=sel.split('-').map(Number),sd=new Date(s[0],s[1]-1,s[2]),first=(new Date(y,mo,1).getDay()+6)%7,n=new Date(y,mo+1,0).getDate(),td=todayStr();
  let g=DOW.map(d=>`<i>${d}</i>`).join('')+'<span></span>'.repeat(first);
  for(let d=1;d<=n;d++){const iso=y+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');g+=`<button type="button" class="${iso===sel?'s':''} ${iso===td?'t':''}" onclick="calSel('${iso}')">${d}</button>`}
  m.innerHTML=`<div class="cal"><div class="ch"><small>${s[0]}</small><b>${DIAS[sd.getDay()]}, ${s[2]} de ${MES3[s[1]-1]}</b></div>
  <div class="cb"><div class="cn"><button type="button" onclick="calGo(-12)" aria-label="Año anterior">«</button><button type="button" onclick="calGo(-1)" aria-label="Mes anterior">‹</button><b>${MESES[mo]} de ${y}</b><button type="button" onclick="calGo(1)" aria-label="Mes siguiente">›</button><button type="button" onclick="calGo(12)" aria-label="Año siguiente">»</button></div><div class="cg">${g}</div></div>
  <div class="cf"><button type="button" onclick="calClear()">Borrar</button><button type="button" onclick="calClose()">Cancelar</button><button type="button" class="ok" onclick="calOk()">Establecer</button></div></div>`}
function calGo(k){let t=CAL.y*12+CAL.m+k;CAL.y=Math.floor(t/12);CAL.m=t%12;calDraw()}
function calSel(iso){CAL.sel=iso;calDraw()}
function calClose(){const m=document.getElementById('calmask');if(m)m.remove()}
function calOk(){const e=document.getElementById(CAL.id);if(e)e.value=CAL.sel.split('-').reverse().join('/');calClose()}
function calClear(){const e=document.getElementById(CAL.id);if(e)e.value='';calClose()}
function pickedDate(id,v){if(v)document.getElementById(id).value=v.split('-').reverse().join('/')}
/* orden de las categorías: como las creaste o de la A a la Z */
const catIdx=()=>S.cats.map((_,i)=>i).sort((a,b)=>S.cfg.sortCats?S.cats[a].n.localeCompare(S.cats[b].n,'es',{sensitivity:'base'}):a-b);
function setSort(v){S.cfg.sortCats=!!v;save();const sg=document.getElementById('sortseg');if(sg)Array.prototype.forEach.call(sg.children,(b,k)=>b.classList.toggle('on',(k===1)===!!v));render();toast(v?'Categorías de la A a la Z':'Categorías en tu orden')}
let FM={};
function openAdd(kind,id,metaId){
  let item=null;
  if(id){item=(kind==='gasto'?S.gas:kind==='ingreso'?S.ing:S.aportes).find(x=>x.id===id)}
  FM={kind,id:id||null,cat:item?item.cat:(S.cats[catIdx()[0]]||{}).n,tipo:item?item.tipo||'N':'N',meta:item?item.meta:(metaId||S.metas[0]&&S.metas[0].id)};
  const date=item?item.date:(inP(todayStr(),ui.ym)?todayStr():pRange(ui.ym)[0]);
  const seg=id?'':`<div class="seg">${[['gasto','💸 Gasto'],['ingreso','💰 Ingreso'],['ahorro','🐷 Ahorro']].map(([k,l])=>`<button class="${kind===k?'on':''}" onclick="openAdd('${k}',null,FM.meta)">${l}</button>`).join('')}</div>`;
  let body=`<label>Monto</label><div class="amtbox" onclick="document.getElementById('f_amt').focus()"><span id="f_sym">${esc(kind==='ahorro'?metaCur(FM.meta):S.cfg.cur)}</span><input id="f_amt" inputmode="decimal" autocomplete="off" placeholder="-" value="${item?item.amt:''}" oninput="amtIn(this)"></div>`;
  if(kind==='gasto')body+=`<label>¿En qué fue?</label><input id="f_desc" placeholder="Ej. Delivery, taxi, café…" value="${esc(item?item.desc:'')}">
    <button class="mic" id="micb" onclick="doVoice()">🎙️ Dictar con la voz</button>
    <label>Categoría</label><div class="chips" id="catchips"></div>
    <label>Tipo de gasto</label><div class="chips"><button class="chip n" id="t_N" onclick="setTipo('N')">✅ Necesario</button><button class="chip m" id="t_M" onclick="setTipo('M')">💸 Gasto Hormiga (impulso)</button></div>`;
  if(kind==='ingreso')body+=`<label>Descripción</label><input id="f_desc" placeholder="Sueldo, extra…" value="${esc(item?item.desc:'')}">`;
  if(kind==='ahorro')body+=`<label>Meta (el aporte se guarda en la moneda de la meta)</label><select id="f_meta" onchange="FM.meta=this.value;amtSym()">${S.metas.map(m=>`<option value="${m.id}" ${m.id===FM.meta?'selected':''}>${esc(m.n)}</option>`).join('')}</select>`;
  body+=`<label>Fecha</label>${dateField('f_date',date)}`;
  sheet(`<h3>${id?'Editar':'Nuevo'} ${kind}</h3>${seg}${body}<div class="two" style="margin-top:16px">${id?'<button class="btn del" onclick="delItem()">Eliminar</button>':'<button class="btn sec" onclick="closeSheet()">Cancelar</button>'}<button class="btn" onclick="saveItem()">Guardar</button></div>`);
  amtFit();
  if(kind==='gasto'){drawCats();setTipo(FM.tipo);
    const fd=document.getElementById('f_desc');
    if(fd)fd.addEventListener('change',()=>{ /* si dictas con el teclado, completa monto y categoría */
      const p=parseVoice(fd.value),fa=document.getElementById('f_amt');
      if(p.amt&&fa&&!fa.value){fa.value=p.amt;amtFit()}
      if(p.cat&&!FM.ct){FM.cat=p.cat;drawCats()}if(p.muerto)setTipo('M')})}
}
function amtFit(){const e=document.getElementById('f_amt');if(e)e.style.width=Math.max(1,e.value.length)+'ch'}
function amtSym(){const e=document.getElementById('f_sym');if(e)e.textContent=FM.kind==='ahorro'?metaCur(FM.meta):S.cfg.cur}
function amtIn(e){let v=e.value.replace(',','.').replace(/[^0-9.]/g,'');const k=v.indexOf('.');if(k>=0)v=v.slice(0,k+1)+v.slice(k+1).replace(/\./g,'').slice(0,2);e.value=v;amtFit()}
function drawCats(){document.getElementById('catchips').innerHTML=catIdx().map(i=>{const c=S.cats[i];return`<button class="chip ${c.n===FM.cat?'on':''}" onclick="FM.cat=S.cats[${i}].n;FM.ct=1;drawCats()">${c.i} ${esc(c.n)}</button>`}).join('')}
function setTipo(t){FM.tipo=t;['N','M'].forEach(k=>{const e=document.getElementById('t_'+k);if(e)e.classList.toggle('on',k===t)})}
function saveItem(){
  const amt=parseFloat(String(val('f_amt')).replace(',','.'));if(!(amt>0)){toast('Escribe un monto');return}
  const dtx=val('f_date').trim(),date=dtx?getDate('f_date'):todayStr(),k=FM.kind;if(!date){toast('Fecha no válida. Escríbela como dd/mm/aaaa');return}
  const arr=k==='gasto'?S.gas:k==='ingreso'?S.ing:S.aportes;
  const o=FM.id?arr.find(x=>x.id===FM.id):{id:uid()};
  o.amt=amt;o.date=date;
  if(k==='gasto'){o.desc=val('f_desc').trim();o.cat=FM.cat;o.tipo=FM.tipo}
  if(k==='ingreso')o.desc=val('f_desc').trim();
  if(k==='ahorro')o.meta=val('f_meta');
  if(!FM.id)arr.push(o);
  save();closeSheet();{const k=ymOf(date);if(k!==ui.ym)ui.ym=k}render();toast('Guardado ✨')
}
function delItem(){const k=FM.kind,arr=k==='gasto'?S.gas:k==='ingreso'?S.ing:S.aportes;const i=arr.findIndex(x=>x.id===FM.id);if(i>=0)arr.splice(i,1);save();closeSheet();render();toast('Eliminado')}

/* voz */
const NUM={uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,quince:15,veinte:20,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,ciento:100};
const KW={Comida:['comida','almuerzo','cena','desayuno','delivery','domicilio','café','cafe','restaurante','pizza','mercado','super','snack'],Transporte:['taxi','uber','bus','pasaje','gasolina','combi','metro'],Ocio:['cine','salida','fiesta','netflix','juego','bar'],'Ropa y cuidado':['ropa','maquillaje','uñas','peluquería','zapatos','cabello'],Salud:['farmacia','medicina','doctor','pastilla'],Hogar:['casa','luz','agua','limpieza'],Estudios:['curso','libro','universidad','clase'],Regalos:['regalo']};
function parseVoice(t){
  const low=t.toLowerCase();let amt=null;const m=low.match(/(\d+([.,]\d+)?)/);
  if(m)amt=parseFloat(m[1].replace(',','.'));else{for(const w of low.split(/\s+/))if(NUM[w]){amt=NUM[w];break}}
  let cat=null;for(const c of S.cats){if(low.includes(c.n.toLowerCase())){cat=c.n;break}}
  if(!cat)for(const [k,ws] of Object.entries(KW)){if(ws.some(w=>low.includes(w))&&S.cats.find(c=>c.n===k)){cat=k;break}}
  const muerto=/(antojo|impulso|delivery|domicilio|capricho|sin querer|por si acaso)/.test(low);
  return{amt,cat,muerto}
}
function voiceAlt(msg){const d=document.getElementById('f_desc');if(d)d.focus();toast(msg)}
function doVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition,b=document.getElementById('micb');
  if(!SR){voiceAlt('Aquí no hay dictado propio. Toca el 🎙️ de tu teclado y habla');return}
  let r;try{r=new SR()}catch(e){voiceAlt('No pude activar el dictado. Usa el 🎙️ de tu teclado');return}r.lang='es-PE';r.interimResults=false;b.classList.add('rec');b.textContent='🎙️ Te escucho… habla ahora';
  r.onresult=e=>{const t=e.results[0][0].transcript,p=parseVoice(t);
    if(p.amt){document.getElementById('f_amt').value=p.amt;amtFit()}
    document.getElementById('f_desc').value=t.charAt(0).toUpperCase()+t.slice(1);
    if(p.cat){FM.cat=p.cat;drawCats()}if(p.muerto)setTipo('M');
    toast(p.amt?'Revisa que esté bien y guarda':'No entendí el monto, escríbelo')};
  r.onerror=e=>{const er=e&&e.error;voiceAlt(er==='not-allowed'||er==='service-not-allowed'?'Falta el permiso del micrófono. Actívalo en Ajustes del teléfono o usa el 🎙️ del teclado':er==='no-speech'?'No te escuché, intenta de nuevo':'No pude escucharte. Usa el 🎙️ de tu teclado')};r.onend=()=>{b.classList.remove('rec');b.textContent='🎙️ Dictar con la voz'};
  try{r.start()}catch(e){}
}

  <p style="font-size:12px;color:var(--grey);margin:16px 2px 0">📲 Para usarla como app: en Chrome abre el menú ⋮ → <b>Añadir a pantalla de inicio</b>. En iPhone (Safari): Compartir → <b>Añadir a inicio</b>.</p>
  <p style="font-size:12px;color:var(--grey);text-align:center;margin:14px 0 0">HomeCount v1.0.16</p>`)
}
function saveCfg(){S.cfg.cur=val('s_c')||'S/';S.cfg.meta=parseFloat(val('s_m'))||0;S.cfg.tope=parseFloat(val('s_t'))||0;S.cfg.pday=parseInt(val('s_pd'))||1;ui.ym=ymOf(todayStr());save();closeSheet();render();toast('Ajustes guardados')}
const isWV=()=>/; wv\)/.test(navigator.userAgent);
function textSheet(title,text,hint){window._tx=text;
  sheet(`<h3>${title}</h3><p style="font-size:12.5px;color:var(--grey);margin:0 0 10px">${hint}</p><textarea id="txa" readonly style="width:100%;height:190px;border:2px solid var(--track);background:var(--field);border-radius:14px;padding:10px;font-size:12px;color:var(--ink);font-family:monospace">${esc(text)}</textarea><div class="two" style="margin-top:12px"><button class="btn sec" onclick="closeSheet()">Cerrar</button><button class="btn" onclick="copyTx()">📋 Copiar todo</button></div>`)}
function copyTx(){const t=window._tx||'',ok=()=>toast('Copiado ✨ Pégalo en Notas, WhatsApp o un correo'),fb=()=>{const a=document.getElementById('txa');if(!a)return;a.removeAttribute('readonly');a.focus();a.select();try{document.execCommand('copy')?ok():toast('Mantén presionado el texto y elige Copiar')}catch(e){toast('Mantén presionado el texto y elige Copiar')}a.setAttribute('readonly','')};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb()}
function dl(name,text,type){
  if(isWV()){textSheet('📄 '+name,text,'Esta app no puede guardar archivos directamente. Toca <b>Copiar todo</b> y pégalo en Notas, WhatsApp o un correo. Si es el CSV, guárdalo con extensión .csv para abrirlo en Excel.');return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportJSON(){dl('respaldo_finanzas_'+todayStr()+'.json',JSON.stringify(S),'application/json')}
function exportCSV(){const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const rows=['Fecha,Concepto,Monto,Categoria,Tipo'].concat(S.gas.sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,q(x.desc),x.amt,q(x.cat),x.tipo==='M'?'Hormiga':'Necesario'].join(',')));
  dl('gastos_'+todayStr()+'.csv','﻿'+rows.join('\n'),'text/csv')}
function applyImport(txt){try{const d=JSON.parse(txt);if(!d.cfg||!d.gas)throw 0;S=d;save();closeSheet();ui.ym=ymOf(todayStr());render();toast('Datos importados ✨')}catch(e){toast('Ese texto no es un respaldo válido')}}
function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>applyImport(r.result);r.readAsText(f)}
/* importar gastos desde CSV (Fecha,Concepto,Monto,Categoria,Tipo): AÑADE, no reemplaza */
function parseCSV(t){t=String(t).replace(/^﻿/,'');const first=t.split(/\r?\n/)[0]||'',sep=(first.split(';').length>first.split(',').length)?';':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===sep){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
    else f+=c}
  row.push(f);if(row.some(x=>x.trim()!==''))rows.push(row);return rows}
function csvDate(x){x=String(x||'').trim();let m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(x);let y,mo,d;
  if(m){y=+m[1];mo=+m[2];d=+m[3]}else{m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/.exec(x);if(!m)return '';d=+m[1];mo=+m[2];y=+m[3]}
  const dt=new Date(y,mo-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return '';return y+'-'+pad2(mo)+'-'+pad2(d)}
function importCSVText(txt){
  const rows=parseCSV(txt);if(rows.length<2){toast('Ese archivo no parece un CSV de gastos');return}
  const norm=h=>String(h).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
  const H=rows[0].map(norm),ix=n=>H.indexOf(n);
  const iF=ix('fecha'),iC=ix('concepto'),iM=ix('monto'),iK=ix('categoria'),iT=ix('tipo');
  if(iF<0||iM<0){toast('Faltan columnas: Fecha y Monto son obligatorias');return}
  let add=0,dup=0,bad=0,newCats=0;
  const seen=new Set(S.gas.map(g=>[g.date,+g.amt,(g.desc||'').trim(),g.cat].join('|')));
  rows.slice(1).forEach(r=>{
    const date=csvDate(r[iF]),amt=parseFloat(String(r[iM]||'').replace(/[^\d.,-]/g,'').replace(',','.'));
    if(!date||!(amt>0)){bad++;return}
    const desc=iC>=0?String(r[iC]||'').trim():'';let cat=iK>=0?String(r[iK]||'').trim():'';
    if(!cat)cat=(S.cats.find(c=>c.n==='Otros')||S.cats[0]).n;
    const ex=S.cats.find(c=>c.n.toLowerCase()===cat.toLowerCase());
    if(ex)cat=ex.n;else{S.cats.push({n:cat,i:'✨',b:0});newCats++}
    const tp=iT>=0?norm(r[iT]||''):'',tipo=(tp==='muerto'||tp==='hormiga'||tp==='m')?'M':'N';
    const key=[date,amt,desc,cat].join('|');if(seen.has(key)){dup++;return}
    seen.add(key);S.gas.push({id:uid(),amt,desc,cat,tipo,date});add++});
  save();closeSheet();ui.ym=ymOf(todayStr());render();
  toast(`Se agregaron ${add} gastos`+(dup?` · ${dup} repetidos omitidos`:'')+(bad?` · ${bad} filas con error`:'')+(newCats?` · ${newCats} categorías nuevas`:''))}
function importCSVFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importCSVText(r.result);r.readAsText(f);inp.value=''}
function openPasteCSV(){sheet(`<h3>📋 Pegar gastos (CSV)</h3><p style="font-size:12.5px;color:var(--grey);margin:0 0 10px">Pega el texto con las columnas <b>Fecha, Concepto, Monto, Categoria, Tipo</b>. Se <b>añaden</b> a tus gastos; no se borra nada.</p><textarea id="pc" placeholder="Fecha,Concepto,Monto,Categoria,Tipo" style="width:100%;height:190px;border:2px solid var(--track);background:var(--field);border-radius:14px;padding:10px;font-size:12px;color:var(--ink);font-family:monospace"></textarea><div class="two" style="margin-top:12px"><button class="btn sec" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="importCSVText(val('pc'))">Añadir gastos</button></div>`)}
function openPaste(){sheet(`<h3>📋 Pegar respaldo</h3><p style="font-size:12.5px;color:var(--grey);margin:0 0 10px">Pega aquí el texto de tu respaldo (empieza con <b>{</b>). Reemplazará los datos actuales.</p><textarea id="pt" placeholder="Pega aquí…" style="width:100%;height:190px;border:2px solid var(--track);background:var(--field);border-radius:14px;padding:10px;font-size:12px;color:var(--ink);font-family:monospace"></textarea><div class="two" style="margin-top:12px"><button class="btn sec" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="applyImport(val('pt'))">Importar</button></div>`)}

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
/* botón atrás del teléfono: siempre hay una entrada de historial "guardia" encima, así el sistema nunca cierra la app de golpe.
   Atrás cierra calendario/hoja → vuelve a Inicio → avisa y recién con otro Atrás sale. */
(function(){
  let ready=false,exitAt=0;
  const repush=()=>{try{history.pushState({hc:1},'')}catch(e){}};
  function arm(){if(ready)return;try{history.pushState({hc:1},'');ready=true}catch(e){}}
  ['pointerdown','touchstart','click','keydown'].forEach(ev=>window.addEventListener(ev,arm,{passive:true}));
  window.addEventListener('popstate',()=>{
    if(!ready)return;
    const cm=document.getElementById('calmask');if(cm){cm.remove();repush();return}
    const m=document.getElementById('mask');if(m){m.remove();repush();return}
    if(ui.tab!=='home'){ui.tab='home';render();window.scrollTo(0,0);repush();return}
    if(Date.now()-exitAt<2500){ready=false;history.back();return}
    exitAt=Date.now();toast('Toca atrás otra vez para salir');repush()
  });
})();
/* teclado: que no tape las opciones */
(function(){const vv=window.visualViewport;
  function fit(){const m=document.getElementById('mask');if(!m||!vv)return;const kb=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);m.style.paddingBottom=kb+'px';const sh=m.firstElementChild;if(sh)sh.style.maxHeight=Math.round(vv.height*.94)+'px'}
  if(vv){vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit)}
  document.addEventListener('focusin',e=>{const t=e.target;if(!t||!t.closest||!t.closest('.sheet'))return;setTimeout(()=>{fit();try{t.scrollIntoView({block:'center',behavior:'smooth'})}catch(x){}},320)});
  document.addEventListener('focusout',()=>setTimeout(fit,200))})();
applyTheme(S.cfg.theme);render();if(!S.cfg.theme)askTheme();
