<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EFE5F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HomeCount">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>HomeCount · Presupuesto del Hogar</title>
<style>
:root{--sh:185,162,224;--track:#EFE7F7;--field:#FCFAFE;--bg1:#F1E8FA;--bg2:#FBE9F1;--bg3:#E6F1FA;--pink:#F4A6BE;--pinkL:#FBDCE6;--lil:#B9A2E0;--lilL:#E9DFF7;--sky:#A9CDEF;--skyL:#DCEBF8;--mint:#AEE0C9;--mintL:#D9F1E6;--gold:#F6D98C;--ink:#4A3558;--pur:#7B4B94;--grey:#8A7A94;--card:rgba(255,255,255,.88)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);background-attachment:fixed}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(110px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:0;color:var(--pur)}
h2{font-size:15px;margin:22px 4px 10px;color:var(--pur)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.icon-btn{border:0;background:var(--card);width:40px;height:40px;border-radius:14px;font-size:18px;box-shadow:0 3px 10px rgba(var(--sh),.2);color:var(--ink)}
.month{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 14px}
.month b{min-width:150px;text-align:center;font-size:16px;color:var(--pur)}
.month button{border:0;background:var(--card);width:34px;height:34px;border-radius:12px;font-size:16px;color:var(--pur);box-shadow:0 3px 8px rgba(var(--sh),.2)}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 6px 18px rgba(var(--sh),.18);margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{border-radius:18px;padding:12px 14px;color:var(--ink)}
.mini small{display:block;font-size:11px;opacity:.75;margin-bottom:3px}
.mini b{font-size:17px}
.ringwrap{position:relative;width:230px;height:230px;margin:2px auto 6px}
.ringwrap svg{width:100%;height:100%}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringc small{font-size:12px;color:var(--grey)}
.ringc b{font-size:26px;color:var(--pur)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.pill{display:inline-block;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700}
.ok{background:var(--mintL);color:#2D7A5B}.warn{background:#FFF1C9;color:#8A6A12}.bad{background:var(--pinkL);color:#A03A5A}.none{background:var(--lilL);color:var(--pur)}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--track)}
.row:last-child{border-bottom:0}
.ico{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;background:var(--lilL)}
.grow{flex:1;min-width:0}
.grow b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow small{color:var(--grey);font-size:11.5px}
.amt{font-weight:700;font-size:14px;white-space:nowrap}
.neg{color:#B0435F}.pos{color:#2D7A5B}
.bar{height:8px;border-radius:6px;background:var(--track);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--lil)}
.bar i.over{background:var(--pink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:0;padding:8px 13px;border-radius:999px;background:var(--lilL);color:var(--pur);font-size:13px;font-weight:600}
.chip.on{background:var(--lil);color:#fff}
.chip.m.on{background:var(--pink)}.chip.n.on{background:var(--mint);color:#27644B}
.seg{display:flex;background:var(--lilL);border-radius:16px;padding:4px;margin:0 0 12px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:12px;font-size:13px;font-weight:700;color:var(--pur)}
.seg button.on{background:#fff;box-shadow:0 2px 8px rgba(var(--sh),.27)}
.days{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:10px}
.days span{aspect-ratio:1;border-radius:50%;font-size:9.5px;display:flex;align-items:center;justify-content:center;background:var(--track);color:var(--grey)}
.days .c{background:var(--mint);color:#27644B}.days .d{background:var(--pink);color:#7e2a44}
.btn{border:0;border-radius:16px;padding:13px 18px;font-weight:700;font-size:14px;background:var(--lil);color:#fff;width:100%}
.btn.sec{background:var(--lilL);color:var(--pur)}.btn.del{background:var(--pinkL);color:#A03A5A}
.empty{text-align:center;color:var(--grey);font-size:13px;padding:18px 8px}
.chk{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--lil);background:#fff;font-size:15px;color:#fff;flex:none}
.chk.on{background:var(--mint);border-color:var(--mint)}
nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-radius:26px 26px 0 0;display:flex;justify-content:space-around;align-items:flex-end;padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 22px rgba(var(--sh),.2);z-index:5}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--grey);padding:4px 10px;font-weight:600}
nav button span{font-size:21px;filter:grayscale(1) opacity(.55)}
nav button.on{color:var(--pur)}nav button.on span{filter:none}
nav .fab{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--lil));color:#fff;font-size:30px;margin-top:-26px;box-shadow:0 8px 18px rgba(var(--sh),.47);justify-content:center;padding:0;line-height:1}
.mask{position:fixed;inset:0;background:rgba(40,30,50,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 12px;color:var(--pur);font-size:17px}
label{display:block;font-size:12px;color:var(--grey);margin:12px 2px 5px;font-weight:600}
input,select{width:100%;border:2px solid var(--track);background:var(--field);border-radius:14px;padding:12px 13px;font-size:16px;color:var(--ink);font-family:inherit}
input:focus,select:focus{outline:0;border-color:var(--lil)}
.big{font-size:34px!important;font-weight:800;text-align:center;color:var(--pur)}
.mic{width:100%;margin-top:10px;border:2px dashed var(--lil);background:var(--lilL);color:var(--pur);border-radius:16px;padding:11px;font-weight:700;font-size:14px}
.mic.rec{background:var(--pinkL);border-color:var(--pink);color:#A03A5A}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}.tcard{border:3px solid transparent;background:#fff;border-radius:22px;padding:12px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.08);font-family:inherit}.tcard.on{border-color:var(--lil)}.tcard b{display:block;font-size:15px;margin-top:8px;color:#333}.tcard small{color:#777;font-size:11.5px}.sw{display:flex;height:54px;border-radius:14px;overflow:hidden}.sw i{flex:1}.full{position:fixed;inset:0;z-index:40;overflow:auto;padding:calc(env(safe-area-inset-top) + 36px) 18px 30px;background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3))}.full .in{max-width:480px;margin:0 auto}#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;z-index:30;opacity:0;transition:.25s;pointer-events:none;max-width:86%;text-align:center}
#toast.on{opacity:1}
.tot{display:flex;justify-content:space-between;font-size:13px;color:var(--grey);margin:2px 4px 10px}
.tot b{color:var(--pur)}
.rc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rc button{border:2px solid var(--lilL);background:#fff;border-radius:14px;padding:8px 2px;font-size:12px;color:var(--ink);font-weight:700}
.rc button small{display:block;font-weight:500;color:var(--grey);font-size:10px}
.rc button.on{background:var(--mint);border-color:var(--mint);color:#27644B}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
'use strict';
const KEY='lila_finanzas_v1';
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DEF_CATS=[['Comida','🍽️'],['Transporte','🚌'],['Ocio','🎬'],['Ropa y cuidado','💄'],['Salud','💊'],['Hogar','🏠'],['Estudios','📚'],['Regalos','🎁'],['Otros','✨']];
const uid=()=>Math.random().toString(36).slice(2,9);
const todayStr=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,k)=>a.reduce((t,x)=>t+(+x[k]||0),0);
let S=load();
const THEMES={
 fucsia:{n:'Fucsia',s:'Tono para mujer',v:{'--pink':'#F4A6BE','--pinkL':'#FBDCE6','--lil':'#B9A2E0','--lilL':'#E9DFF7','--sky':'#A9CDEF','--skyL':'#DCEBF8','--mint':'#AEE0C9','--mintL':'#D9F1E6','--ink':'#4A3558','--pur':'#7B4B94','--grey':'#8A7A94','--track':'#EFE7F7','--field':'#FCFAFE','--sh':'185,162,224','--bg1':'#F1E8FA','--bg2':'#FBE9F1','--bg3':'#E6F1FA'},tc:'#EFE5F8',ic:['#F4A6BE','#B9A2E0']},
 azul:{n:'Azul',s:'Tono para hombre',v:{'--pink':'#F0A3A3','--pinkL':'#F9DADA','--lil':'#7FA6E0','--lilL':'#DCE8F8','--sky':'#8FD0E6','--skyL':'#D8EFF7','--mint':'#A8DCC8','--mintL':'#D6F0E6','--ink':'#1F3350','--pur':'#24508F','--grey':'#6F8099','--track':'#E4ECF7','--field':'#F7FAFE','--sh':'95,143,208','--bg1':'#EAF1FB','--bg2':'#E6F4FA','--bg3':'#F1F5FB'},tc:'#EAF1FB',ic:['#8FD0E6','#5F8FD0']},
 verde:{n:'Verde',s:'Unisex',v:{'--pink':'#F4A9A0','--pinkL':'#FBDDD8','--lil':'#7DC9A0','--lilL':'#DAF1E4','--sky':'#A6D8D0','--skyL':'#DDF1EE','--mint':'#B7DD8E','--mintL':'#E6F3D3','--ink':'#1F4235','--pur':'#2E7D5B','--grey':'#6E8A7C','--track':'#E3F1E9','--field':'#F7FCF9','--sh':'95,176,136','--bg1':'#E9F6EE','--bg2':'#F4FAEA','--bg3':'#E6F3F0'},tc:'#E9F6EE',ic:['#B7DD8E','#5FB088']},
 naranja:{n:'Naranja',s:'Unisex',v:{'--pink':'#EE8FA3','--pinkL':'#FADCE3','--lil':'#F5A25D','--lilL':'#FDE6D0','--sky':'#F7C77E','--skyL':'#FDEFD0','--mint':'#A7D9A0','--mintL':'#DDF1D8','--ink':'#4A2E1B','--pur':'#B5561E','--grey':'#8F7766','--track':'#F7EADD','--field':'#FFFAF5','--sh':'224,160,96','--bg1':'#FDF0E3','--bg2':'#FBE8DD','--bg3':'#FFF6E0'},tc:'#FDF0E3',ic:['#F7C77E','#F08A3C']}
};
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#999';
function makeIcon(a,b){
  const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,a);g.addColorStop(1,b);x.fillStyle=g;x.fillRect(0,0,180,180);
  x.lineWidth=22;x.strokeStyle='rgba(255,255,255,.92)';x.beginPath();x.arc(90,90,52,0,7);x.stroke();
  const arcs=[[-1.57,.3,cv('--sky')],[.5,1.8,cv('--mint')],[2.0,3.0,'#F6D98C']];
  arcs.forEach(([s,e,col])=>{x.strokeStyle=col;x.beginPath();x.arc(90,90,52,s,e);x.stroke()});
  x.fillStyle='#fff';x.beginPath();x.arc(90,90,22,0,7);x.fill();x.fillStyle=b;x.beginPath();x.arc(90,90,16,0,7);x.fill();
  x.fillStyle='#fff';x.fillRect(86,78,8,24);x.fillRect(78,80,24,5);x.fillRect(78,93,24,5);
  return c.toDataURL('image/png')
}
function applyTheme(k){
  const t=THEMES[k]||THEMES.fucsia,r=document.documentElement;
  Object.entries(t.v).forEach(([a,b])=>r.style.setProperty(a,b));
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t.tc;
  
}
function themeCards(cur){return Object.entries(THEMES).map(([k,t])=>`<button class="tcard ${k===cur?'on':''}" onclick="pickTheme('${k}')"><div class="sw"><i style="background:${t.v['--lil']}"></i><i style="background:${t.v['--sky']}"></i><i style="background:${t.v['--mint']}"></i><i style="background:${t.v['--pink']}"></i></div><b>${t.n}</b><small>${t.s}</small></button>`).join('')}
function pickTheme(k){S.cfg.theme=k;save();applyTheme(k);const f=document.getElementById('full');if(f)f.remove();closeSheet();render();toast('Estilo '+THEMES[k].n+' ✨')}
function askTheme(){
  const d=document.createElement('div');d.className='full';d.id='full';
  d.innerHTML=`<div class="in"><h1 style="font-size:26px;text-align:center">¿Qué estilo prefieres?</h1><p style="text-align:center;color:var(--grey);margin:8px 0 18px">Elige los colores de tu app. Podrás cambiarlos cuando quieras en ⚙️ Ajustes.</p><div class="themes">${themeCards('')}</div></div>`;
  document.body.appendChild(d)
}

let ui={tab:'home',ym:todayStr().slice(0,7),filter:'all',fk:'fijo'};
function fresh(){return{cfg:{cur:'S/',meta:20,tope:5},ing:[],gas:[],cats:DEF_CATS.map(([n,i])=>({n,i,b:0})),fijos:[],metas:[{id:uid(),n:'Fondo de emergencia',obj:0,date:''}],aportes:[],reto:{}}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.cfg)return s}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No pude guardar en este navegador')}}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
const money=n=>S.cfg.cur+' '+(+n||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const catIcon=n=>(S.cats.find(c=>c.n===n)||{i:'✨'}).i;
const ymLabel=ym=>MESES[+ym.slice(5,7)-1]+' '+ym.slice(0,4);
function shift(d){let [y,m]=ui.ym.split('-').map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}ui.ym=y+'-'+String(m).padStart(2,'0');render()}
const dayLabel=d=>{const x=new Date(d+'T12:00');return ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][x.getDay()]+' '+x.getDate()+' '+MESES[x.getMonth()].slice(0,3)};
const timesPaid=f=>Object.keys(f.paid||{}).filter(k=>f.paid[k]).length;

function calc(ym){
  const ing=sum(S.ing.filter(x=>x.date.startsWith(ym)),'amt');
  const g=S.gas.filter(x=>x.date.startsWith(ym));
  const vars=sum(g.filter(x=>x.tipo!=='M'),'amt'),muertos=sum(g.filter(x=>x.tipo==='M'),'amt');
  const fijos=sum(S.fijos.filter(f=>f.paid&&f.paid[ym]),'amt');
  const comprometido=sum(S.fijos,'amt');
  const ahorro=sum(S.aportes.filter(a=>a.date.startsWith(ym)),'amt');
  const gastado=fijos+vars+muertos,disp=ing-gastado-ahorro;
  let est='none';
  if(ing>0){est=disp<0?'bad':((ahorro/ing*100<S.cfg.meta||muertos/ing*100>S.cfg.tope)?'warn':'ok')}
  return{ing,vars,muertos,fijos,comprometido,ahorro,gastado,disp,est,g}
}
const EST={ok:'Controlado',warn:'Cuidado',bad:'Me pasé',none:'Sin ingresos aún'};

/* ---------- vistas ---------- */
function ring(c){
  const R=78,C=2*Math.PI*R,base=Math.max(c.ing,c.gastado+c.ahorro,1);
  let off=0,s=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${cv('--track')}" stroke-width="20"/>`;
  [[c.fijos,cv('--lil')],[c.vars,cv('--sky')],[c.muertos,cv('--pink')],[c.ahorro,cv('--mint')]].forEach(([v,col])=>{
    if(v<=0)return;const len=v/base*C;
    s+=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${col}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;off+=len});
  return`<div class="ringwrap"><svg viewBox="0 0 200 200">${s}</svg><div class="ringc"><small>Disponible</small><b>${money(c.disp)}</b><small>de ${money(c.ing)}</small></div></div>`
}
function viewHome(){
  const c=calc(ui.ym);const pend=Math.max(c.comprometido-c.fijos,0);
  const [y,m]=ui.ym.split('-').map(Number),nd=new Date(y,m,0).getDate(),t=todayStr();
  const mdays=new Set(c.g.filter(x=>x.tipo==='M').map(x=>+x.date.slice(8,10)));
  let days='',limpios=0;
  for(let d=1;d<=nd;d++){const ds=ui.ym+'-'+String(d).padStart(2,'0');
    if(ds>t){days+=`<span>${d}</span>`}else if(mdays.has(d)){days+=`<span class="d">${d}</span>`}else{limpios++;days+=`<span class="c">${d}</span>`}}
  const byCat={};c.g.filter(x=>x.tipo==='M').forEach(x=>byCat[x.cat]=(byCat[x.cat]||0)+(+x.amt));
  const top=Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
  const pctM=c.ing>0?(c.muertos/c.ing*100):0;
  const cats=S.cats.map((k,i)=>{const sp=sum(c.g.filter(x=>x.cat===k.n),'amt');const p=k.b>0?sp/k.b*100:0;
    return`<div class="row" onclick="editCat(${i})"><div class="ico">${k.i}</div><div class="grow"><b>${esc(k.n)}</b><div class="bar"><i class="${p>100?'over':''}" style="width:${Math.min(p,100)}%"></i></div></div><div class="amt" style="text-align:right">${money(sp)}<br><small style="color:var(--grey);font-weight:500">de ${k.b>0?money(k.b):'sin límite'}</small></div></div>`}).join('');
  return`
  <div class="card">${ring(c)}
    <div class="legend"><span><i style="background:var(--lil)"></i>Fijos ${money(c.fijos)}</span><span><i style="background:var(--sky)"></i>Variables ${money(c.vars)}</span><span><i style="background:var(--pink)"></i>Muertos ${money(c.muertos)}</span><span><i style="background:var(--mint)"></i>Ahorro ${money(c.ahorro)}</span></div>
    <div style="text-align:center;margin-top:12px"><span class="pill ${c.est}">${EST[c.est]}</span></div>
    ${pend>0?`<p style="text-align:center;font-size:12.5px;color:var(--grey);margin:12px 6px 0">Tienes <b>${money(pend)}</b> de fijos por pagar. Cuando los pagues te quedarán <b style="color:var(--pur)">${money(c.disp-pend)}</b> libres.</p>`:''}
  </div>
  <div class="grid2">
    <div class="mini" style="background:var(--mintL)"><small>Ingresos</small><b>${money(c.ing)}</b></div>
    <div class="mini" style="background:var(--lilL)"><small>Fijos por pagar</small><b>${money(Math.max(c.comprometido-c.fijos,0))}</b></div>
    <div class="mini" style="background:var(--skyL)"><small>Total gastado</small><b>${money(c.gastado)}</b></div>
    <div class="mini" style="background:var(--pinkL)"><small>Ahorro del mes</small><b>${money(c.ahorro)}</b></div>
  </div>
  <h2>💸 Mis gastos muertos</h2>
  <div class="card">

function viewFijos(){

function sheet(html){closeSheet();const m=document.createElement('div');m.className='mask';m.id='mask';m.innerHTML=`<div class="sheet">${html}</div>`;m.addEventListener('click',e=>{if(e.target===m)closeSheet()});document.body.appendChild(m)}

const val=id=>document.getElementById(id).value;
let FM={};
function openAdd(kind,id,metaId){

  body+=`<label>Fecha</label><input id="f_date" type="date" value="${date}">`;
  sheet(`<h3>${id?'Editar':'Nuevo'} ${kind}</h3>${seg}${body}<div class="two" style="margin-top:16px">${id?'<button class="btn del" onclick="delItem()">Eliminar</button>':'<button class="btn sec" onclick="closeSheet()">Cancelar</button>'}<button class="btn" onclick="saveItem()">Guardar</button></div>`);
  if(kind==='gasto'){drawCats();setTipo(FM.tipo)}
  setTimeout(()=>{const a=document.getElementById('f_amt');if(a&&!id)a.focus()},120)
}
function drawCats(){document.getElementById('catchips').innerHTML=S.cats.map((c,i)=>`<button class="chip ${c.n===FM.cat?'on':''}" onclick="FM.cat=S.cats[${i}].n;drawCats()">${c.i} ${esc(c.n)}</button>`).join('')}
function setTipo(t){FM.tipo=t;['N','M'].forEach(k=>{const e=document.getElementById('t_'+k);if(e)e.classList.toggle('on',k===t)})}
function saveItem(){
  const amt=parseFloat(String(val('f_amt')).replace(',','.'));if(!(amt>0)){toast('Escribe un monto');return}
  const date=val('f_date')||todayStr(),k=FM.kind;
  const arr=k==='gasto'?S.gas:k==='ingreso'?S.ing:S.aportes;
  const o=FM.id?arr.find(x=>x.id===FM.id):{id:uid()};
  o.amt=amt;o.date=date;

  if(k==='ingreso')o.desc=val('f_desc').trim();

  save();closeSheet();if(date.slice(0,7)!==ui.ym)ui.ym=date.slice(0,7);render();toast('Guardado ✨')
}
function delItem(){const k=FM.kind,arr=k==='gasto'?S.gas:k==='ingreso'?S.ing:S.aportes;const i=arr.findIndex(x=>x.id===FM.id);if(i>=0)arr.splice(i,1);save();closeSheet();render();toast('Eliminado')}

/* voz */
const NUM={uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,quince:15,veinte:20,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,ciento:100};
const KW={Comida:['comida','almuerzo','cena','desayuno','delivery','domicilio','café','cafe','restaurante','pizza','mercado','super','snack'],Transporte:['taxi','uber','bus','pasaje','gasolina','combi','metro'],Ocio:['cine','salida','fiesta','netflix','juego','bar'],'Ropa y cuidado':['ropa','maquillaje','uñas','peluquería','zapatos','cabello'],Salud:['farmacia','medicina','doctor','pastilla'],Hogar:['casa','luz','agua','limpieza'],Estudios:['curso','libro','universidad','clase'],Regalos:['regalo']};
function parseVoice(t){
  const low=t.toLowerCase();let amt=null;const m=low.match(/(\d+([.,]\d+)?)/);
  if(m)amt=parseFloat(m[1].replace(',','.'));else{for(const w of low.split(/\s+/))if(NUM[w]){amt=NUM[w];break}}
  let cat=null;for(const c of S.cats){if(low.includes(c.n.toLowerCase())){cat=c.n;break}}
  if(!cat)for(const [k,ws] of Object.entries(KW)){if(ws.some(w=>low.includes(w))&&S.cats.find(c=>c.n===k)){cat=k;break}}
  const muerto=/(antojo|impulso|delivery|domicilio|capricho|sin querer|por si acaso)/.test(low);
  return{amt,cat,muerto}
}
function doVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition,b=document.getElementById('micb');
  if(!SR){toast('Tu navegador no tiene dictado. Usa el micrófono del teclado 🎙️');return}
  const r=new SR();r.lang='es-PE';r.interimResults=false;b.classList.add('rec');b.textContent='🎙️ Te escucho… habla ahora';
  r.onresult=e=>{const t=e.results[0][0].transcript,p=parseVoice(t);
    if(p.amt)document.getElementById('f_amt').value=p.amt;
    document.getElementById('f_desc').value=t.charAt(0).toUpperCase()+t.slice(1);
    if(p.cat){FM.cat=p.cat;drawCats()}if(p.muerto)setTipo('M');
    toast(p.amt?'Revisa que esté bien y guarda':'No entendí el monto, escríbelo')};
  r.onerror=()=>toast('No pude escucharte');r.onend=()=>{b.classList.remove('rec');b.textContent='🎙️ Dictar con la voz'};
  try{r.start()}catch(e){}
}

  <label>Tope de gastos muertos (% de tus ingresos)</label><input id="s_t" inputmode="numeric" value="${S.cfg.tope}">
  <button class="btn" style="margin-top:14px" onclick="saveCfg()">Guardar ajustes</button>
  <h3 style="margin-top:22px">🎨 Estilo</h3><div class="themes">${themeCards(S.cfg.theme)}</div>
  <h3 style="margin-top:22px">💾 Respaldo</h3>
  <p style="font-size:12.5px;color:var(--grey);margin:0 0 10px">Tus datos se guardan solo en este celular. Descarga un respaldo para pasarlos a otro dispositivo o por seguridad.</p>
  <div class="two"><button class="btn sec" onclick="exportJSON()">⬇️ Descargar</button><button class="btn sec" onclick="document.getElementById('imp').click()">⬆️ Importar</button></div>
  <input id="imp" type="file" accept=".json,application/json" style="display:none" onchange="importJSON(this)">
  <button class="btn sec" style="margin-top:10px" onclick="exportCSV()">📄 Exportar gastos (CSV para Excel)</button>
  <button class="btn del" style="margin-top:10px" onclick="if(confirm('¿Borrar TODOS tus datos?')){S=fresh();save();closeSheet();render()}">Borrar todo</button>
  <p style="font-size:12px;color:var(--grey);margin:16px 2px 0">📲 Para usarla como app: en Chrome abre el menú ⋮ → <b>Añadir a pantalla de inicio</b>. En iPhone (Safari): Compartir → <b>Añadir a inicio</b>.</p>`)
}
function saveCfg(){S.cfg.cur=val('s_c')||'S/';S.cfg.meta=parseFloat(val('s_m'))||0;S.cfg.tope=parseFloat(val('s_t'))||0;save();closeSheet();render();toast('Ajustes guardados')}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportJSON(){dl('respaldo_finanzas_'+todayStr()+'.json',JSON.stringify(S),'application/json')}
function exportCSV(){const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const rows=['Fecha,Concepto,Monto,Categoria,Tipo'].concat(S.gas.sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,q(x.desc),x.amt,q(x.cat),x.tipo==='M'?'Muerto':'Necesario'].join(',')));
  dl('gastos_'+todayStr()+'.csv','﻿'+rows.join('\n'),'text/csv')}
function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.cfg||!d.gas)throw 0;S=d;save();closeSheet();render();toast('Datos importados ✨')}catch(e){toast('Ese archivo no es un respaldo válido')}};r.readAsText(f)}

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
applyTheme(S.cfg.theme);render();if(!S.cfg.theme)askTheme();
</script>
<script src="billing.js"></script>
</body>
</html>
